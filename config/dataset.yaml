dataset:
  source_root: /path/to/source_fish_landmark_data
  source_database: /path/to/fish_keypoints.db
  output_root: ./data/derived
  benchmark_package: ./data/benchmark_v1
  qa_root: ./qa
  expected_source_records: 2699
  expected_anatomical_points: 11
  scale_endpoint_role_ids: [1, 2]
  dominant_legacy_csv_scale_ids: [12, 13]
  digest_algorithm: blake2b-64
  benchmark_seed: 20260825
  standard_split_ratios:
    train: 0.70
    validation: 0.15
    test: 0.15

semantic_status:
  fish_landmarks_1_to_11: role-aware source order recovered from the fish YOLO row
  canonical_names: provisional pending source-team point-by-point confirmation
  scale_side_convention: provisional pending source-team acquisition confirmation
  physical_scale: unavailable until represented length and unit are confirmed

